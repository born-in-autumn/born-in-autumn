name: Waka Readme

on:
  schedule:
    # 每天 UTC 时间 18:30 运行（即北京时间凌晨 2:30），可按需调整
    - cron: '30 18 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}